<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>お問い合わせ管理｜株式会社返礼屋管理</title>
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body class="admin-body">
  <div class="admin-shell" id="admin-shell">
    <div class="admin-main">
      <div class="admin-topbar">
        <div style="display:flex;align-items:center;gap:0.75rem;">
          <button type="button" class="menu-toggle-admin" id="admin-menu-toggle" aria-label="メニュー">☰</button>
          <div>
            <h1>お問い合わせ</h1>
            <p class="meta">Webフォームからの問い合わせ一覧</p>
          </div>
        </div>
        <select id="filter-status" style="padding:0.5rem 0.75rem;border:1px solid var(--admin-border);border-radius:6px;">
          <option value="all">すべての状態</option>
          <option value="new">新規</option>
          <option value="in_progress">対応中</option>
          <option value="completed">完了</option>
        </select>
      </div>

      <div class="admin-panel">
        <div class="admin-table-wrap">
          <table class="admin-table" id="table">
            <thead>
              <tr>
                <th>受付日時</th>
                <th>お名前</th>
                <th>連絡先</th>
                <th>内容（抜粋）</th>
                <th>状態</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/local-config.js"></script>
  <script src="../js/admin-auth.js"></script>
  <script src="../js/sheets-config.js"></script>
  <script src="../js/admin-store.js"></script>
  <script src="../js/admin-ui.js"></script>
  <script>
    (async function () {
      if (!(await AdminUI.bootstrap('inquiries'))) throw new Error('auth');

      function excerpt(t, n) {
        t = String(t || '');
        return t.length > n ? t.slice(0, n) + '…' : t || '—';
      }

      function render() {
        const filter = document.getElementById('filter-status').value;
        let list = HenreiyaStore.getInquiries();
        if (filter !== 'all') list = list.filter((i) => i.status === filter);
        const tbody = document.querySelector('#table tbody');
        if (!list.length) {
          tbody.innerHTML = '<tr><td colspan="6" class="empty-state">該当するお問い合わせがありません</td></tr>';
          return;
        }
        tbody.innerHTML = list
          .map(
            (i) => `<tr>
          <td>${HenreiyaStore.formatDateTime(i.createdAt)}</td>
          <td>${i.name || '—'}${i.company ? '<br /><span style="font-size:11px;color:#6b6860;">' + i.company + '</span>' : ''}</td>
          <td style="font-size:12px;">${i.tel || ''}<br />${i.email || ''}</td>
          <td>${excerpt(i.message, 40)}</td>
          <td>${AdminUI.badge(i.status)}</td>
          <td class="actions">
            <button type="button" class="admin-btn admin-btn-ghost" data-view="${i.id}">詳細</button>
            <button type="button" class="admin-btn admin-btn-danger" data-del="${i.id}">削除</button>
          </td>
        </tr>`
          )
          .join('');

        tbody.querySelectorAll('[data-view]').forEach((btn) => {
          btn.addEventListener('click', () => showDetail(btn.dataset.view));
        });
        tbody.querySelectorAll('[data-del]').forEach((btn) => {
          btn.addEventListener('click', async () => {
            if (!confirm('このお問い合わせを削除しますか？')) return;
            await HenreiyaStore.deleteInquiry(btn.dataset.del);
            render();
          });
        });
      }

      function showDetail(id) {
        const i = HenreiyaStore.getInquiries().find((x) => x.id === id);
        if (!i) return;
        AdminUI.openModal(`
        <h3>お問い合わせ詳細</h3>
        <dl class="detail-dl">
          <div><dt>ID</dt><dd>${i.id}</dd></div>
          <div><dt>受付</dt><dd>${HenreiyaStore.formatDateTime(i.createdAt)}</dd></div>
          <div><dt>お名前</dt><dd>${i.name || '—'}</dd></div>
          <div><dt>会社名</dt><dd>${i.company || '—'}</dd></div>
          <div><dt>電話</dt><dd>${i.tel || '—'}</dd></div>
          <div><dt>メール</dt><dd>${i.email || '—'}</dd></div>
          <div><dt>内容</dt><dd style="white-space:pre-wrap;">${i.message || '—'}</dd></div>
          <div><dt>状態</dt><dd>${AdminUI.statusSelect(i.status, i.id)}</dd></div>
        </dl>
        <div class="admin-modal__actions">
          <button type="button" class="admin-btn admin-btn-primary" id="save-status">状態を保存</button>
          <button type="button" class="admin-btn admin-btn-ghost" id="close-modal">閉じる</button>
        </div>
      `);
        document.getElementById('close-modal').onclick = AdminUI.closeModal;
        document.getElementById('save-status').onclick = async () => {
          const sel = document.querySelector(`[data-status-for="${i.id}"]`);
          await HenreiyaStore.updateInquiry(i.id, { status: sel.value });
          AdminUI.closeModal();
          render();
        };
      }

      document.getElementById('filter-status').addEventListener('change', render);
      render();
    })();
  </script>
</body>
</html>
